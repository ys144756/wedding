<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결혼 준비 통합 체크리스트 & 대시보드</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-slate-800 pb-16">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-rose-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center text-xl shadow-md shadow-rose-200">
                    <i class="fa-solid fa-heart"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Our Wedding Planner</h1>
                    <p class="text-xs text-rose-500 font-medium" id="headerSubText">야탑 W힐스 컨벤션 • 2월 13일(토) 14:20</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openSummaryModal()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs sm:text-sm font-medium rounded-xl shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square"></i> 예식·예산 편집
                </button>
                <button onclick="addNewCard()" class="px-3.5 py-2 bg-rose-500 hover:bg-rose-600 text-white text-xs sm:text-sm font-medium rounded-xl shadow-sm transition flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> 항목 추가
                </button>
                <button onclick="resetData()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs sm:text-sm font-medium rounded-xl transition" title="초기화">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">

        <!-- Banner Summary Section (Editable Dashboard) -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Wedding Hall & Schedule Highlight Card -->
            <div class="bg-gradient-to-br from-rose-500 to-pink-600 rounded-2xl p-5 text-white shadow-lg shadow-rose-100 relative overflow-hidden flex flex-col justify-between">
                <div class="absolute -right-4 -bottom-4 opacity-15 text-8xl">
                    <i class="fa-solid fa-church"></i>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <span class="inline-block px-2.5 py-0.5 bg-white/20 backdrop-blur-md text-xs font-semibold rounded-full">📍 예식 확정</span>
                        <button onclick="openSummaryModal()" class="text-xs text-rose-100 hover:text-white bg-white/10 px-2 py-0.5 rounded-lg transition">수정</button>
                    </div>
                    <h2 class="text-lg font-bold" id="dashVenue">야탑 W힐스 컨벤션</h2>
                    <p class="text-sm opacity-90 mt-0.5" id="dashDateTime">2.13 (토) 오후 2시 20분 시작</p>
                    <p class="text-xs text-rose-100 mt-1 font-light" id="dashArrivalTime"><i class="fa-regular fa-clock mr-1"></i>최소 도착시간: 오후 1시 00분</p>
                </div>
                <div class="mt-4 pt-3 border-t border-white/20 flex justify-between items-center text-xs">
                    <span>우선순위</span>
                    <span class="font-semibold text-rose-100" id="dashPriority">신혼여행 > 메이크업 > 드레스</span>
                </div>
            </div>

            <!-- Hall Budget Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Hall Budget</span>
                        <h3 class="text-base font-bold text-slate-800 mt-1">예식장 예상 비용</h3>
                    </div>
                    <div class="p-2 bg-amber-50 text-amber-500 rounded-xl text-sm">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                </div>
                <div class="my-3">
                    <div class="text-2xl font-extrabold text-slate-900" id="dashHallTotal">995 만원 <span class="text-xs font-normal text-slate-400">+ @</span></div>
                    <p class="text-xs text-slate-500 mt-1" id="dashHallDetail">식수 150명 (5.3만) + 대관 170만 + 컨시어지 30만</p>
                </div>
                <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-amber-400 h-full w-3/4"></div>
                </div>
            </div>

            <!-- SDM Budget Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">SDM Budget</span>
                        <h3 class="text-base font-bold text-slate-800 mt-1">스드메 기본 예산</h3>
                    </div>
                    <div class="p-2 bg-purple-50 text-purple-500 rounded-xl text-sm">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                </div>
                <div class="my-3">
                    <div class="text-2xl font-extrabold text-slate-900" id="dashSdmTotal">165 ~ 200 <span class="text-sm font-normal text-slate-500">만원</span></div>
                    <p class="text-xs text-slate-500 mt-1" id="dashSdmDetail">헬퍼비 등 기타 필수 비용 110만원 별도</p>
                </div>
                <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div class="bg-purple-400 h-full w-2/3"></div>
                </div>
            </div>
        </section>

        <!-- Search & Filter Controls -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0 w-full sm:w-auto">
                <button onclick="filterCards('all')" class="filter-btn active px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-900 text-white transition">전체보기</button>
                <button onclick="filterCards('대기')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">대기중</button>
                <button onclick="filterCards('진행중')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">진행중</button>
                <button onclick="filterCards('완료')" class="filter-btn px-3.5 py-1.5 text-xs font-medium rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">완료</button>
            </div>
            <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="searchCards()" placeholder="항목 및 메모 검색..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-400">
            </div>
        </div>

        <!-- Main Items Cards Grid -->
        <div id="plannerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JavaScript will render cards dynamically -->
        </div>

    </main>

    <!-- Modal for Editing Top Summary & Budget -->
    <div id="summaryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl transition-all scale-95 opacity-0 transform" id="summaryModalContainer">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                <h3 class="text-base font-bold text-slate-800"><i class="fa-solid fa-pen-to-square text-rose-500 mr-1.5"></i> 예식 정보 및 예산 편집</h3>
                <button onclick="closeSummaryModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form onsubmit="saveSummaryData(event)" class="space-y-3.5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">예식장 이름</label>
                        <input type="text" id="inputVenue" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">예식 일시</label>
                        <input type="text" id="inputDateTime" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">최소 도착 시간</label>
                        <input type="text" id="inputArrivalTime" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">우선순위 요약</label>
                        <input type="text" id="inputPriority" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-amber-600 mb-1">예식장 예산 (총액 표시)</label>
                    <input type="text" id="inputHallTotal" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">예식장 예산 상세 세부내역</label>
                    <input type="text" id="inputHallDetail" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                </div>

                <div class="pt-2 border-t border-slate-100">
                    <label class="block text-xs font-semibold text-purple-600 mb-1">스드메 예산 (범위 표시)</label>
                    <input type="text" id="inputSdmTotal" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">스드메 예산 세부내역</label>
                    <input type="text" id="inputSdmDetail" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeSummaryModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-medium transition">취소</button>
                    <button type="submit" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-medium transition shadow-md">대시보드 저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Editing/Adding Item Card -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl transition-all scale-95 opacity-0 transform" id="modalContainer">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
                <h3 class="text-base font-bold text-slate-800" id="modalTitle">항목 편집</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="editForm" onsubmit="saveModalData(event)" class="space-y-4">
                <input type="hidden" id="modalItemId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리명</label>
                    <input type="text" id="modalCategory" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">상태</label>
                        <select id="modalStatus" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                            <option value="대기">⏳ 대기</option>
                            <option value="진행중">🚀 진행중</option>
                            <option value="완료">✅ 완료</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">아이콘</label>
                        <select id="modalIcon" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none">
                            <option value="fa-church">⛪ 예식장</option>
                            <option value="fa-camera">📸 스튜디오</option>
                            <option value="fa-person-dress">👗 드레스</option>
                            <option value="fa-wand-magic-sparkles">💄 메이크업</option>
                            <option value="fa-plane">✈️ 신혼여행</option>
                            <option value="fa-user-tie">👔 예복/한복</option>
                            <option value="fa-bus">🚌 버스대절</option>
                            <option value="fa-music">🎵 축가</option>
                            <option value="fa-envelope">✉️ 청첩장</option>
                            <option value="fa-video">📹 영상</option>
                            <option value="fa-list-check">📋 기타</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상세 구성 내용 (줄바꿈 구분)</label>
                    <textarea id="modalContent" rows="5" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none leading-relaxed"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">특이사항 / 메모</label>
                    <input type="text" id="modalMemo" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-rose-400 outline-none" placeholder="비고 입력">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-medium transition">취소</button>
                    <button type="submit" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-medium transition shadow-md shadow-rose-200">저장하기</button>
                </div>
            </form>
        </div>
    </div>

                id: 11,
                category: "기타 (하객 / 수급 / 소개비)",
                icon: "fa-list-check",
                status: "대기",
                content: [
                    "하객 리스트 작성",
                    "축의금 수급 담당자 지정",
                    "소개비 정산"
                ],
                memo: "본식 1달 전 최종 확정"
            }
        ];

        let summaryData = {};
        let plannerData = [];
        let currentFilter = 'all';

        // Initialize All App State
        function initData() {
            // Load Dashboard Summary Data
            const savedSummary = localStorage.getItem('wedding_planner_summary');
            if (savedSummary) {
                summaryData = JSON.parse(savedSummary);
            } else {
                summaryData = { ...defaultSummaryData };
                saveSummary();
            }
            renderSummary();

            // Load Card Items
            const savedPlanner = localStorage.getItem('wedding_planner_data');
            if (savedPlanner) {
                plannerData = JSON.parse(savedPlanner);
            } else {
                plannerData = JSON.parse(JSON.stringify(initialPlannerData));
                saveData();
            }
            renderCards();
        }

        function saveSummary() {
            localStorage.setItem('wedding_planner_summary', JSON.stringify(summaryData));
        }

        function saveData() {
            localStorage.setItem('wedding_planner_data', JSON.stringify(plannerData));
        }

        // Render Top Dashboard Elements
        function renderSummary() {
            document.getElementById('headerSubText').innerText = `${summaryData.venue} • ${summaryData.dateTime.split('시작')[0]}`;
            document.getElementById('dashVenue').innerText = summaryData.venue;
            document.getElementById('dashDateTime').innerText = summaryData.dateTime;
            document.getElementById('dashArrivalTime').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${summaryData.arrivalTime}`;
            document.getElementById('dashPriority').innerText = summaryData.priority;
            
            document.getElementById('dashHallTotal').innerHTML = summaryData.hallTotal;
            document.getElementById('dashHallDetail').innerText = summaryData.hallDetail;

            document.getElementById('dashSdmTotal').innerHTML = summaryData.sdmTotal;
            document.getElementById('dashSdmDetail').innerText = summaryData.sdmDetail;
        }

        // Summary Modal Handlers
        function openSummaryModal() {
            document.getElementById('inputVenue').value = summaryData.venue;
            document.getElementById('inputDateTime').value = summaryData.dateTime;
            document.getElementById('inputArrivalTime').value = summaryData.arrivalTime;
            document.getElementById('inputPriority').value = summaryData.priority;
            document.getElementById('inputHallTotal').value = summaryData.hallTotal;
            document.getElementById('inputHallDetail').value = summaryData.hallDetail;
            document.getElementById('inputSdmTotal').value = summaryData.sdmTotal;
            document.getElementById('inputSdmDetail').value = summaryData.sdmDetail;

            const modal = document.getElementById('summaryModal');
            const container = document.getElementById('summaryModalContainer');
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeSummaryModal() {
            const modal = document.getElementById('summaryModal');
            const container = document.getElementById('summaryModalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function saveSummaryData(e) {
            e.preventDefault();
            summaryData = {
                venue: document.getElementById('inputVenue').value,
                dateTime: document.getElementById('inputDateTime').value,
                arrivalTime: document.getElementById('inputArrivalTime').value,
                priority: document.getElementById('inputPriority').value,
                hallTotal: document.getElementById('inputHallTotal').value,
                hallDetail: document.getElementById('inputHallDetail').value,
                sdmTotal: document.getElementById('inputSdmTotal').value,
                sdmDetail: document.getElementById('inputSdmDetail').value
            };
            saveSummary();
            renderSummary();
            closeSummaryModal();
        }

        // Render Main Grid Cards
        function renderCards() {
            const grid = document.getElementById('plannerGrid');
            grid.innerHTML = '';

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            const filtered = plannerData.filter(item => {
                const matchFilter = (currentFilter === 'all') || (item.status === currentFilter);
                const matchSearch = item.category.toLowerCase().includes(searchTerm) || 
                                    item.content.some(c => c.toLowerCase().includes(searchTerm)) ||
                                    (item.memo && item.memo.toLowerCase().includes(searchTerm));
                return matchFilter && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                        <p class="text-sm">해당하는 항목이 없습니다.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group";

                const statusStyles = {
                    '대기': 'bg-slate-100 text-slate-600 border-slate-200',
                    '진행중': 'bg-amber-50 text-amber-600 border-amber-200',
                    '완료': 'bg-emerald-50 text-emerald-600 border-emerald-200'
                };

                const contentList = item.content.map(text => 
                    `<li class="text-xs text-slate-600 leading-relaxed flex items-start gap-1.5">
                        <span class="text-slate-300 mt-0.5">•</span> <span>${text}</span>
                     </li>`
                ).join('');

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-xl bg-slate-50 text-slate-600 flex items-center justify-center text-sm group-hover:bg-rose-50 group-hover:text-rose-500 transition">
                                    <i class="fa-solid ${item.icon}"></i>
                                </div>
                                <h3 class="font-bold text-slate-800 text-sm">${item.category}</h3>
                            </div>
                            
                            <select onchange="updateStatus(${item.id}, this.value)" class="text-xs font-medium px-2 py-1 rounded-lg border ${statusStyles[item.status]} cursor-pointer focus:outline-none">
                                <option value="대기" ${item.status === '대기' ? 'selected' : ''}>⏳ 대기</option>
                                <option value="진행중" ${item.status === '진행중' ? 'selected' : ''}>🚀 진행중</option>
                                <option value="완료" ${item.status === '완료' ? 'selected' : ''}>✅ 완료</option>
                            </select>
                        </div>

                        <ul class="space-y-1.5 my-3 bg-slate-50/50 p-3 rounded-xl border border-slate-100/80">
                            ${contentList}
                        </ul>
                    </div>

                    <div>
                        ${item.memo ? `
                        <div class="text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1.5 rounded-lg mb-3 flex items-center gap-1.5">
                            <i class="fa-regular fa-comment-dots text-slate-400"></i>
                            <span class="truncate">${item.memo}</span>
                        </div>
                        ` : ''}

                        <div class="flex justify-end items-center gap-1.5 pt-2 border-t border-slate-100">
                            <button onclick="openModal(${item.id})" class="px-2.5 py-1 text-xs text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition flex items-center gap-1">
                                <i class="fa-regular fa-pen-to-square"></i> 편집
                            </button>
                            <button onclick="deleteCard(${item.id})" class="px-2.5 py-1 text-xs text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition flex items-center gap-1">
                                <i class="fa-regular fa-trash-can"></i> 삭제
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Inline Status Update
        function updateStatus(id, newStatus) {
            const idx = plannerData.findIndex(item => item.id === id);
            if (idx !== -1) {
                plannerData[idx].status = newStatus;
                saveData();
                renderCards();
            }
        }

        // Category Filter
        function filterCards(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-600');
            event.target.classList.add('bg-slate-900', 'text-white');
            renderCards();
        }

        // Search Input Functionality
        function searchCards() {
            renderCards();
        }

        // Delete Card
        function deleteCard(id) {
            if (confirm('이 항목을 삭제하시겠습니까?')) {
                plannerData = plannerData.filter(item => item.id !== id);
                saveData();
                renderCards();
            }
        }

        // Reset Everything
        function resetData() {
            if (confirm('모든 데이터가 초기 상태로 리셋됩니다. 진행하시겠습니까?')) {
                localStorage.removeItem('wedding_planner_summary');
                localStorage.removeItem('wedding_planner_data');
                initData();
            }
        }

        // Card Modal Controls
        function openModal(id = null) {
            const modal = document.getElementById('editModal');
            const container = document.getElementById('modalContainer');
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);

            if (id) {
                const item = plannerData.find(i => i.id === id);
                document.getElementById('modalTitle').innerText = '항목 수정하기';
                document.getElementById('modalItemId').value = item.id;
                document.getElementById('modalCategory').value = item.category;
                document.getElementById('modalStatus').value = item.status;
                document.getElementById('modalIcon').value = item.icon;
                document.getElementById('modalContent').value = item.content.join('\n');
                document.getElementById('modalMemo').value = item.memo || '';
            } else {
                document.getElementById('modalTitle').innerText = '새 항목 추가하기';
                document.getElementById('modalItemId').value = '';
                document.getElementById('editForm').reset();
            }
        }

        function closeModal() {
            const modal = document.getElementById('editModal');
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function addNewCard() {
            openModal(null);
        }

        function saveModalData(e) {
            e.preventDefault();
            const id = document.getElementById('modalItemId').value;
            const category = document.getElementById('modalCategory').value;
            const status = document.getElementById('modalStatus').value;
            const icon = document.getElementById('modalIcon').value;
            const contentText = document.getElementById('modalContent').value;
            const memo = document.getElementById('modalMemo').value;

            const contentArr = contentText.split('\n').filter(line => line.trim() !== '');

            if (id) {
                const idx = plannerData.findIndex(item => item.id === parseInt(id));
                if (idx !== -1) {
                    plannerData[idx] = {
                        ...plannerData[idx],
                        category,
                        status,
                        icon,
                        content: contentArr,
                        memo
                    };
                }
            } else {
                const newId = plannerData.length > 0 ? Math.max(...plannerData.map(p => p.id)) + 1 : 1;
                plannerData.push({
                    id: newId,
                    category,
                    status,
                    icon,
                    content: contentArr,
                    memo
                });
            }

            saveData();
            closeModal();
            renderCards();
        }

        // Initialize App on Window Load
        window.onload = initData;
    </script>
</body>
</html>
